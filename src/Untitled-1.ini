[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit Fingerprint Sensor Library@^1.2.2
    adafruit/RTClib@^2.1.2
    bblanchon/ArduinoJson@6.21.3  # SPECIFIC VERSION 6
    esphome/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

; Memory settings
board_build.partitions = default_8MB.csv
monitor_filters = esp32_exception_decoder